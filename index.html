<body>
    <P>Dionisio Pamplona Polo o Dionisio de San Barnabás (Calamocha, 11 de octubre de 1868-Monzón, 25 de julio de 1936) fue un sacerdote escolapio español, asesinado durante la Guerra Civil en 1936. Considerado mártir, es venerado como beato en la Iglesia católica.</P>
